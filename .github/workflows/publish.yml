name: Publish

# Publishing a GitHub Release packages the extension and pushes it to both the
# VS Code Marketplace and Open VSX. Tokens are repo secrets:
#   VSCE_PAT   - VS Code Marketplace (Azure DevOps PAT, Marketplace: Manage)
#   OVSX_TOKEN - Open VSX access token
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'SametAtas/rein-vscode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx vsce package --no-dependencies
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath *.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: npx ovsx publish *.vsix --pat "$OVSX_PAT"
